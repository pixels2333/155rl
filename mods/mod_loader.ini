[ModLoader]
; 全局总开关：1=启用, 0=禁用所有 Mod
Enabled=1
; Mod 根目录（相对游戏可执行文件所在目录）
ModsDir=mods
; 日志输出文件名
LogFile=mod_loader.log
; 实时控制台窗口 (类似 BepInEx Console, 0=关闭, 1=显示)
Console=0

[Mods]
; 在此显式开关各个 Mod (1=启用, 0=禁用)
; 若未在此配置，则默认遵循各自 mods/<mod_id>/mod.ini 中的 Enabled 选项
th135_lastwords=1
koishi_spells=0
th135_bg_mobs=1
