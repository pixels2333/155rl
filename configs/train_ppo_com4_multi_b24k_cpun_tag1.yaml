# =============================================================================
# 对战 COM4, 换人启蒙实验(tag1): 只把 w_tag_recover 0.05 -> 1.0(×20), 其余与 e200 完全一致。
# 依据: 换人行为发生率 0~3%(sw 均值 0.06/局), w_tag_recover=0.05 下白血差 3000 点
#   换人成功仅拿 0.05×0.3=0.015, 相对 terminal ±2.5~3.3 差两个数量级 ——
#   策略 2000+ update 没碰过换人, 是奖励盖不住探索噪声, 不是"不想换"。
#   1.0 下 3000 点白血换人拿 0.3, 与 w_guard_punish(0.15)同量级, 值得考虑但远小于
#   terminal, 不会为刷分无脑换人。tag_recover_cap=4 / tag_min_gap 不动(防套利阀)。
# 主判读: sw(换人次数)是否从 ~0.06 抬起 + rec 同步涨; 次判读 win。
# 反套利检查: 局时长不涨、KO 率不掉、sw 爆涨但 win 不动则叫停。
# 用法: .scratch/infra3/launch_b16k.ps1 -Resume checkpoints\com4_multi_b24k_cpun_e200\best.pt -Log multi_b24k_com4_cpun_tag1 -Config configs\train_ppo_com4_multi_b24k_cpun_tag1.yaml
# =============================================================================
env:
  team: 0
  action_repeat: 1
  round_seconds: 99
  max_episode_steps: 9400
  difficulty: 3               # COM4 (内部 com_level 3; 0..4 = COM1..COM5)
  frame_timeout: 1.0
  lockstep: true
  lockstep_timeout_ms: 0
  frame_period_us: 4166

reward:
  guard_window: 25
  w_guard_punish: 0.15
  w_counter: 0.08
  w_countered_punish: 0.16    # 被康非对称惩罚(只扣我方), 经 combat_scale 0.25 后 0.04/次
  w_guard_read: 0.03
  guard_read_range: 240.0
  w_spell_interrupt: 0.20
  w_tag_recover: 1.0          # 0.05 -> 1.0: 换人启蒙(单变量, 其余不动)
  terminal_win: 2.5
  terminal_lose: -2.5
  terminal_draw: -1.5
  kill_instinct_hp: 2000.0
  kill_instinct_mult: 1.5

network:
  motion_vocab: 10240
  motion_embed: 16
  team_hidden: 128
  global_hidden: 64
  proj_hidden: 64
  fuse_hidden: 256
  lstm_hidden: 256
  lstm_layers: 1
  orthogonal_init: true

train:
  num_envs: 6
  total_updates: 300
  schedule_total_updates: 2610
  n_steps: 4096               # 每个 env;合计 24576
  seq_len: 64
  epochs: 4
  minibatch_seqs: 16
  gamma: 0.9995
  gae_lambda: 0.97
  clip_range: 0.2
  value_coef: 0.5
  entropy_coef: 0.0035
  max_grad_norm: 0.5
  lr: 3.0e-5
  lr_mode: constant
  lr_anneal: false
  lr_final_scale: 1.0
  target_kl: 0.03
  seed: 0
  orthogonal_init: true

checkpoint:
  dir: checkpoints/com4_multi_b24k_cpun_tag1
  save_every: 5
  keep: 10

eval:
  interval: 30
  episodes: 200
  deterministic: false

curriculum:
  enabled: true
  apply_mode: restart
  difficulty_switch: restart
  window: 100
  min_decided: 30
  stages:
    - name: com4
      com_levels: [3]
      promote_win_rate: null
      entropy_scale: 1.0

logging:
  tensorboard: runs/th155_ppo_com4_multi_b24k_cpun_tag1
  print_every: 1
