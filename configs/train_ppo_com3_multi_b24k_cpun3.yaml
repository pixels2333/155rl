# =============================================================================
# 6 实例大批次, lr 1e-4, 被康惩罚回到 0.16 + 抬高"真格挡"的价值。
# 与 cpun 的差异: reward.w_guard_block 0.05 -> 0.25 / baria 0.08 -> 0.30 / just 0.12 -> 0.45,
#                guard_block_quota 7 -> 10, guard_block_cap 15 -> 20 (真实格挡不走 guard_round_cap)。
# 依据:
#   * 被康惩罚剂量-反应已测完: 0.16 时 74~75%(66/66/67/75/75/74/74); 0.32 时回到 72/68,
#     被康占比只从 46% 掉到 45%, 胜率反而降 -> 再加剂量只压参与度, 不回本。所以本段回到 0.16。
#   * 防御通道实测失效(1522 局): guard_read 每局均值 59.95/上限 60(且被 guard_round_cap 0.45
#     在约 15 帧就封顶) = 常数奖励; 真格挡 guard_block 均值 0.05 次/局、仅 4.9% 的局触发,
#     而一次格挡只值 0.05 ≈ 250 点实血(胜场 dmg ≈ +1.0~2.0)。即"被康"有罚、正面替代几乎没有价。
#   * 格挡/确反是结果型事件(不可空刷、不走回合上限), 抬价是唯一能让它进入探索的办法。
# 用法: python -m train.train_ppo --config configs/train_ppo_com3_multi_b24k_cpun3.yaml --resume checkpoints/com3_multi_b24k_cpun/best.pt
# =============================================================================
env:
  team: 0
  action_repeat: 1
  round_seconds: 99
  max_episode_steps: 9400
  difficulty: 2               # COM3
  frame_timeout: 1.0
  lockstep: true
  lockstep_timeout_ms: 0
  frame_period_us: 4166

reward:
  guard_window: 25
  w_guard_punish: 0.15
  w_counter: 0.08
  w_countered_punish: 0.16    # 被康非对称惩罚(只扣我方), 经 combat_scale 0.25 后 0.04/次
  w_guard_block: 0.25         # 真格挡 0.05 -> 0.25 (≈1250 点实血当量), 结果型不可空刷
  w_guard_block_baria: 0.30   # 结界格挡 0.08 -> 0.30
  w_guard_block_just: 0.45    # 精准格挡 0.12 -> 0.45
  guard_block_quota: 10       # 连续纯防配额锁 7 -> 10 (配合抬价后的单回合上限)
  guard_block_cap: 20         # 单回合格挡计分总上限 15 -> 20
  w_guard_read: 0.03
  guard_read_range: 240.0
  w_spell_interrupt: 0.20
  terminal_win: 2.5
  terminal_lose: -2.5
  terminal_draw: -1.5
  kill_instinct_hp: 2000.0
  kill_instinct_mult: 1.5

network:
  motion_vocab: 10240
  motion_embed: 16
  team_hidden: 128
  global_hidden: 64
  proj_hidden: 64
  fuse_hidden: 256
  lstm_hidden: 256
  lstm_layers: 1
  orthogonal_init: true

train:
  num_envs: 6
  total_updates: 300          # 断点 1200 + 300 = end 1500(10 次门控评估)
  schedule_total_updates: 1500
  n_steps: 4096               # 每个 env;合计 24576
  seq_len: 64
  epochs: 4
  minibatch_seqs: 16
  gamma: 0.9995
  gae_lambda: 0.97
  clip_range: 0.2
  value_coef: 0.5
  entropy_coef: 0.0035
  max_grad_norm: 0.5
  lr: 1.0e-4                  # 2e-4 在 lr2 线 1110 掉 20pp, 本次不叠加变量
  lr_mode: constant
  lr_anneal: false
  lr_final_scale: 1.0
  target_kl: 0.03
  seed: 0
  orthogonal_init: true

checkpoint:
  dir: checkpoints/com3_multi_b24k_cpun3
  save_every: 5
  keep: 10

eval:
  interval: 30
  episodes: 100
  deterministic: false

curriculum:
  enabled: true
  apply_mode: restart
  difficulty_switch: restart
  window: 100
  min_decided: 30
  stages:
    - name: com3
      com_levels: [2]
      promote_win_rate: null
      entropy_scale: 1.0
    - name: com4_5
      com_levels: [3, 4]
      promote_win_rate: null
      entropy_scale: 0.6
      reward_overrides: { w_approach: 0.0 }

logging:
  tensorboard: runs/th155_ppo_com3_multi_b24k_cpun3
  print_every: 1
