# =============================================================================
# 强化学习环境超参数(观测归一化 / 动作 / 奖励权重)
# 由 src/env/th155_env.py 通过 th155.env.load_env_config() 载入。
# 物理上限来自实机观测(见 docs/re_notes.md):场地 1280x720,生命 10000,
# MP/OP 1000,回合 99s x 90 帧。
# =============================================================================
arena:
  width: 1280.0
  height: 720.0
  center_x: 640.0
  center_y: 360.0
  # 角色离版边的"安全"距离(归一化),用于版边压制奖励与自身贴墙惩罚
  corner_threshold: 0.15

limits:
  max_hp: 10000.0
  max_regain: 10000.0
  max_mp: 1000.0
  max_op: 1000.0
  sp_ball: 200.0            # 每格灵力值
  sp_balls_max: 5.0         # 满灵力格数
  occult_max: 2000.0        # 怪奇槽(team.op)满值:player_input.nut 用 op == 2000 判定符卡
  max_speed: 20.0           # 水平/垂直速度归一化基准
  motion_frame_norm: 60.0   # 动作帧归一化基准
  stun_norm: 60.0           # 硬直帧归一化基准
  timer_seconds: 99.0

match:
  # 只在 state == 8(真正可操作)时注入输入;回合演出/载入期间关闭注入
  inject_fighting_only: true
  # 回合开始时清零 battle.win(必须用完整 tag),避免打满 2 胜进入无法推进的胜负对话
  win_guard: true

observation:
  max_projectiles: 16
  projectile_dims: 7

action:
  action_repeat: 1          # 每 1 帧决策一次 = 60 Hz (物理极限)
  hold_guard_ticks: 20      # 持续格挡状态机维持帧数 K (16~24 帧, 约 0.33s)
  reversal_hold_ticks: 6    # 暗转解冻/确反缓冲维持帧数 (确保解冻第一瞬间指令稳固送入引擎)
  key_pulse_repeat: true    # 连续相同攻击键自动处理脉冲上升沿 (普通连招 AAAA 连打)

reward:
  w_damage: 2.0             # 实血伤害差(零和势函数差分)
  w_regain: 0.5             # 白血上限(regain_life)削减/保持差
  w_tag_recover: 0.05       # 积累大量白血(>= tag_recover_min_gap)时触发换人回血的战术奖励
  tag_recover_min_gap: 1000.0
  w_guard_crush: 0.15       # 破防奖惩(造成 +0.15 / 被破防 -0.15)
  # 防御分量(非零和:只给我方记分,对手格挡不再倒扣)。这些是**实际生效值**,不再乘 combat_scale。
  # 量级参照:一场胜利 terminal ≈ ±1.3、实血项 ≈ ±0.9;旧设计 0.02 被 0.25 缩放成 0.005,
  # 只有一次胜利的 1/260,是"抬权重也学不会防御"的直接原因。
  w_guard_block: 0.05       # 有效格挡奖励·通常防御(Guard_Init 120-123 上升沿)
  w_guard_block_baria: 0.08 # 有效格挡奖励·结界防御(BariaGuard_Init 110-113, 消耗结界槽)
  w_guard_block_just: 0.12  # 有效格挡奖励·精准防御(JustGuard_Init 100-103, 需 1~2 帧时机)
  w_guard_read: 0.03        # 防御姿态稠密引导:对手出招 + 距离 <= guard_read_range + 按住后方向不出招,每步给分
  guard_read_cap: 60        # 单回合最多计分步数(安全阀;正常由 guard_round_cap 先封顶)
  guard_round_cap: 0.45     # 单回合防御总收益硬上限;必须 < 平局惩罚(0.6)与 KO 失败(1.0),否则死防变成正收益
  guard_read_range: 240.0   # 判定"对手威胁到我"的水平距离阈值(像素, 覆盖中近距离挥空/压近)
  proj_threat_range: 180.0  # 敌方弹幕/激光几何威胁判定阈值(像素)
  w_graze: 0.020            # 擦弹闪避奖励(graze_state == 2: Dash穿透弹幕/激光)
  graze_cap: 30             # 单回合最多计分擦弹步数
  guard_block_quota: 7      # 连续纯防配额锁:未打出有效实血命中前最多领 3 次格挡分,杜绝死防刷分
  guard_block_cap: 15       # 单回合有效格挡计分总上限(最多 15 次),确保防御总收益远低于进攻与胜负终局
  w_counter: 0.08           # 打康 / 差合确反(命中时对手 motion ∈ [1000,4999] 即处于出招动作 +0.08, 对称 -0.08)
  w_countered_punish: 0.16  # 被康的非对称额外惩罚(只扣我方, 不奖对手). 零和项里被康只等于对手
                            # +0.08, 经 combat_scale 0.25 后 0.02/次, 相对代价几乎不可见.
                            # 0.16 经缩放后 0.04/次, 单局 3~10 次被康合计 -0.12~-0.40,
                            # 与 guard_round_cap(0.45) 同量级, 不压过 terminal(±2.5).
  w_guard_punish: 0.15      # 防后确反(本侧 guard_window 步内处于防御, 之后命中 +0.15, 对称 -0.15)
  w_combo: 0.01             # 连段确认(combo_gap 步内连续命中, 第 2 击起每击 +0.01, 对称 -0.01)
  combo_cap: 10             # 连段奖励计分上限(最多计到 10 连击)
  combo_gap: 8              # 连段断连阈值(步, 30Hz 下 8 步 ≈ 0.27s 内无新命中即清零)
  guard_window: 25          # 防后确反窗口(步, 60Hz 下 25 步 ≈ 416ms, 覆盖格挡硬直 + 起手出招)
  guard_min_run: 5          # 判定"真格挡"所需连续防御采样数(≈0.17s);COM 的 guard_state
                            # 是每帧随机重掷,短于该阈值的非零只是姿态噪声,不给确反分
  w_spell_interrupt: 0.20   # 符卡确反/大招打断激励 (+0.20 经 combat_scale 0.25 后为 0.05)
  combat_scale: 0.25        # 立回项(打康/确反/连段)整体缩放:COM3 实测单局 combat 累计 -2.5 而实血项
                            # 仅 -1.06,不缩放会压过伤害/终局项;0.25 后单局约 -0.6,与伤害项同量级。
                            # 注意:格挡已移出此项(见上面的 guard 分量),不受此缩放影响。
  w_approach: 0.05          # 战术引导(连续势函数):远距离(d > far_distance)每缩短 1.0 归一化间距的奖励
  w_corner: 0.002           # 战术引导(对称势函数):对手进入版边 +w_corner, 脱离 -w_corner
  w_self_corner: 0.002      # 战术惩罚(对称势函数):自身退入版边 -w_self_corner, 脱离 +w_self_corner
  tactical_decay: 1.0       # 退火系数(1.0 = 全开,0.0 = 关闭)
  terminal_win: 2.5
  terminal_lose: -2.5
  terminal_win_time_bonus: 0.5
  terminal_timeover_win: 1.0
  terminal_timeover_lose: -2.5  # 与 KO 负基线一致(-2.5),堵死劣势方消极跑图拖超时漏洞
  terminal_draw: -1.5       # 平局惩罚(大幅加重平局惩罚, 彻底杜绝死防拖平局刷分)
  w_terminal_margin: 0.5    # 终局血量差系数(KO胜按自身剩余HP加分,KO负按对手剩余HP加重惩罚,超时按HP差加成)
  kill_instinct_hp: 2000.0  # 对手残血斩杀阈值 (HP <= 2000)
  kill_instinct_mult: 1.5   # 残血斩杀伤害激励倍数 (1.5x)
  far_distance: 0.5         # 归一化间距超过该值才算"过远"
